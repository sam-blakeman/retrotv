plugins { id 'com.android.application' }

android {
    namespace 'com.magicv6.retrotv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.magicv6.retrotv'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    // Software audio decoders (MP2, AC-3, E-AC-3, DTS...) for broadcast channels the phone can't decode
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.6.1+2'
}
